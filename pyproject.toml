[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "Cython>=3.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "plyvel-next"
version = "2.1.1"
description = "A fast and feature-rich Python interface to LevelDB"
readme = "README.md"
license = {text = "BSD-3-Clause AND MIT"}
authors = [
    {name = "Wouter Bolsterlee"},
]
maintainers = [
    {name = "Modding Forge", email = "info@moddingforge.com"},
]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Cython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://moddingforge.com"
Repository = "https://github.com/Modding-Forge/plyvel-next"
Changelog = "https://github.com/Modding-Forge/plyvel-next/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "cibuildwheel",
    "Cython>=3.0",
    "sphinx",
    "tox",
    "pytest>=3.6",
    "pytest-cov",
    "setuptools",
]
test = [
    "pytest>=3.6",
    "pytest-cov",
    "setuptools",
]

[tool.setuptools.packages.find]
include = ["plyvel_next*"]

[tool.pytest.ini_options]
addopts = "-sv"
testpaths = ["test"]
