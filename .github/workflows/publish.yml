name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0). If empty on tag push, uses the pushed tag."
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  wheel:
    name: Build ${{ matrix.os }}-${{ matrix.cibw.arch }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: mac-intel
            cibw:
              arch: x86_64
              build: "cp312-* cp313-* cp314-*"

          - os: macos-latest
            name: mac-arm
            cibw:
              arch: universal2
              build: "cp312-* cp313-* cp314-*"

          - os: ubuntu-latest
            name: manylinux-x86_64
            cibw:
              arch: auto
              build: "cp312-* cp313-* cp314-*"

          - os: ubuntu-24.04-arm
            name: manylinux-aarch64
            cibw:
              arch: auto
              build: "cp312-* cp313-* cp314-*"

          - os: windows-2022
            name: win32
            architecture: x86
            cibw:
              arch: x86
              build: "cp312-* cp313-* cp314-*"

          - os: windows-2022
            name: win_amd64
            architecture: x64
            cibw:
              arch: AMD64
              build: "cp312-* cp313-* cp314-*"
    env:
      VCPKG_INCLUDE_PATH: "C:/vcpkg/installed/${{ matrix.architecture }}-windows/include"
      VCPKG_LIB_PATH: "C:/vcpkg/installed/${{ matrix.architecture }}-windows/lib"
      VCPKG_DLL_PATH: "C:/vcpkg/installed/${{ matrix.architecture }}-windows/bin"
      CIBW_BUILD: "${{ matrix.cibw.build || '*' }}"
      CIBW_ENVIRONMENT_MACOS: >
        C_INCLUDE_PATH="$HOME/.local/include:$C_INCLUDE_PATH"
        CPLUS_INCLUDE_PATH="$HOME/.local/include:$CPLUS_INCLUDE_PATH"
        LIBRARY_PATH="$HOME/.local/lib:$LIBRARY_PATH"
      CIBW_ENVIRONMENT_WINDOWS: >
        INCLUDE="C:/local/include;$INCLUDE"
        LIB="C:/local/lib;$LIB"
        PATH="C:/local/bin;$PATH"
      CIBW_ARCHS_LINUX: "${{ matrix.cibw.arch || 'auto' }}"
      CIBW_ARCHS_MACOS: "${{ matrix.cibw.arch || 'auto' }}"
      CIBW_ARCHS_WINDOWS: "${{ matrix.cibw.arch || 'auto' }}"
      CIBW_BEFORE_ALL_LINUX: "gcc -v && bash scripts/install-snappy.sh && bash scripts/install-leveldb.sh"
      CIBW_BEFORE_ALL_MACOS: "clang -v && bash scripts/install-snappy.sh && bash scripts/install-leveldb.sh"
      CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --lib-sdir . -w {dest_dir} {wheel}"
      CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-listdeps {wheel} && delocate-wheel -w {dest_dir} {wheel} -v"
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel} -v"
      CIBW_TEST_REQUIRES: "pytest"
      CIBW_TEST_COMMAND: "pytest -v {package}/test"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}

      - name: Install windows dependencies
        if: runner.os == 'Windows'
        run: |
          PowerShell scripts/install-snappy.ps1
          PowerShell scripts/install-leveldb.ps1

      - name: Install cibuildwheel
        run: |
          pip install -U setuptools pip wheel
          pip install -U cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  publish-pypi:
    name: Publish to PyPI
    needs: [sdist, wheel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC Trusted Publisher

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - uses: astral-sh/setup-uv@v5

      - name: Publish
        run: uv publish

  publish-github:
    name: Create GitHub Release
    needs: [sdist, wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "workflow_dispatch requires input 'tag' (e.g. v2.0.0)" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body: |
            See [CHANGELOG.md](https://github.com/Modding-Forge/plyvel-next/blob/master/CHANGELOG.md) for details.
          files: |
            dist/*.tar.gz
            dist/*.whl
